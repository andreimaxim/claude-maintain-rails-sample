# Settings read through Rails.application.secrets. Supply values through the
# environment; never commit real credentials. Development and tests default to
# the local stand-in provider started by bin/citation-provider.

development:
  citation_provider: &local_citation_provider
    url: <%= ENV.fetch("CITATION_PROVIDER_URL", "http://127.0.0.1:9393").to_json %>
    user: <%= ENV.fetch("CITATION_PROVIDER_USER", "margin-notes").to_json %>
    password: <%= ENV.fetch("CITATION_PROVIDER_PASSWORD", "local-only").to_json %>

test:
  citation_provider: *local_citation_provider

production:
  citation_provider:
    url: <%= ENV["CITATION_PROVIDER_URL"].to_json %>
    user: <%= ENV["CITATION_PROVIDER_USER"].to_json %>
    password: <%= ENV["CITATION_PROVIDER_PASSWORD"].to_json %>
