# Settings read through Rails.application.secrets. Supply values through the
# environment; never commit real credentials. Development and tests default to
# the local stand-in provider started by bin/citation-provider.

development:
  citation_provider: &local_citation_provider
    url: <%= ENV.fetch("CITATION_PROVIDER_URL", "http://127.0.0.1:9393") %>
    user: <%= ENV.fetch("CITATION_PROVIDER_USER", "margin-notes") %>
    password: <%= ENV.fetch("CITATION_PROVIDER_PASSWORD", "local-only") %>

test:
  citation_provider: *local_citation_provider

production:
  citation_provider:
    url: <%= ENV["CITATION_PROVIDER_URL"] %>
    user: <%= ENV["CITATION_PROVIDER_USER"] %>
    password: <%= ENV["CITATION_PROVIDER_PASSWORD"] %>
